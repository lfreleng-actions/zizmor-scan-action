---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Composite action that runs the zizmor GitHub Actions security auditor.
#
# The action reads its pinned zizmor version from its own bundled
# pyproject.toml and its summary parser from its own scripts directory,
# both via ${{ github.action_path }} (the runner checks this action out
# at the pinned ref for the caller). It downloads the matching attested
# zizmor release binary, verifies its Sigstore provenance, audits the
# caller's already-checked-out workspace in SARIF mode, and summarises.
# If GitHub's release CDN stays unavailable after bounded retries, it
# falls back to the PyPI wheel pinned, with a SHA-256 digest, in the
# bundled uv.lock.
#
# The caller is responsible for checking out the repository under audit
# and for hardening the runner. SARIF upload is opt-in via upload-sarif;
# the example workflows instead upload from a separate, least-privilege
# job (see examples/ in this repository).

name: 'Zizmor security audit'
description: 'Audit GitHub Actions workflows with the zizmor static analyser.'

inputs:
  persona:
    description: 'zizmor persona: regular, pedantic, or auditor.'
    required: false
    default: 'auditor'
  min-severity:
    description: >-
      Lowest severity reported: unknown, informational, low, medium,
      high.
    required: false
    default: 'informational'
  min-confidence:
    description: >-
      Lowest confidence reported: low, medium, or high. Empty audits all
      confidences.
    required: false
    default: ''
  working-directory:
    description: 'Path within the workspace to audit.'
    required: false
    default: '.'
  zizmor-version:
    description: 'Override the bundled pin with an explicit tag (e.g. v1.25.2).'
    required: false
    default: ''
  extra-args:
    description: 'Additional raw arguments appended to the zizmor call.'
    required: false
    default: ''
  upload-sarif:
    description: 'Upload the SARIF to code scanning from within this action.'
    required: false
    default: 'false'
  annotate:
    description: >-
      Emit inline annotations for the top findings: 'true' or 'false'.
    required: false
    default: 'true'
  summary-repository:
    description: >-
      owner/repo label for step-summary links; defaults to the
      repository running the workflow. Set when the workspace holds a
      checkout of a different repository. Applies only together with
      summary-sha: a partial or malformed pair is ignored with a
      warning.
    required: false
    default: ''
  summary-sha:
    description: >-
      Commit SHA (7-40 hex digits) for step-summary links; defaults
      to the workflow commit. Applies only together with
      summary-repository: a partial or malformed pair is ignored with
      a warning.
    required: false
    default: ''

outputs:
  sarif-file:
    description: 'Absolute path to the generated SARIF file.'
    value: ${{ steps.zizmor.outputs.sarif }}

runs:
  using: 'composite'
  steps:
    - name: 'Validate inputs'
      shell: 'bash'
      env:
        ANNOTATE: ${{ inputs.annotate }}
      run: |
        set -euo pipefail
        case "${ANNOTATE}" in
          true|false) ;;
          *)
            echo "::error::annotate must be 'true' or 'false'"
            exit 1
            ;;
        esac

    - name: 'Resolve zizmor version'
      id: 'resolve'
      shell: 'bash'
      env:
        OVERRIDE: ${{ inputs.zizmor-version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ -n "${OVERRIDE}" ]; then
          ver="${OVERRIDE#v}"
          src='zizmor-version input'
        else
          ver="$(grep -oE 'zizmor==[0-9][0-9A-Za-z.+-]*' \
            "${ACTION_PATH}/pyproject.toml" | head -n1 | sed 's/^zizmor==//')"
          src='bundled pyproject.toml pin'
        fi
        if ! printf '%s' "${ver}" \
             | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
          echo "error: invalid zizmor version '${ver}'" >&2
          exit 1
        fi
        echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
        echo "Using zizmor ${ver} (from ${src})"

    - name: 'Download and verify zizmor'
      id: 'download'
      shell: 'bash'
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ steps.resolve.outputs.tag }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # Work under a randomised temporary directory so nothing lands in
        # the audited workspace. The fetch script removes the downloaded
        # archive; the cleanup step removes the whole directory.
        work="$(mktemp -d "${RUNNER_TEMP}/zizmor.XXXXXX")"
        echo "workdir=${work}" >> "$GITHUB_OUTPUT"
        # scripts/zizmor_fetch.py downloads the attested release tarball
        # and verifies its Sigstore provenance, retrying transient
        # failures (four retries, 180 seconds per source). If GitHub
        # stays unavailable it falls back to the wheel that uv.lock pins
        # on PyPI and checks the wheel's SHA-256 digest. The script
        # selects the asset for the runner platform (Linux and macOS on
        # x86_64 or arm64) and prints the outputs on stdout. python3 -E -s
        # ignores PYTHONPATH and the user site, and never puts the audited
        # workspace on sys.path; -I would also hide the script's sibling
        # module.
        fetched="$(
          ZIZMOR_TAG="${TAG}" \
          ZIZMOR_WORKDIR="${work}" \
          ZIZMOR_LOCK="${ACTION_PATH}/uv.lock" \
          python3 -E -s "${ACTION_PATH}/scripts/zizmor_fetch.py"
        )"
        printf '%s\n' "${fetched}" >> "$GITHUB_OUTPUT"
        bin="$(printf '%s\n' "${fetched}" | sed -n 's/^zizmor=//p')"
        if [ -z "${bin}" ] || [ ! -x "${bin}" ]; then
          echo "error: zizmor binary not found after download" >&2
          exit 1
        fi
        "${bin}" --version

    - name: 'Run zizmor (SARIF, advisory)'
      id: 'zizmor'
      shell: 'bash'
      env:
        GH_TOKEN: ${{ github.token }}
        PERSONA: ${{ inputs.persona }}
        MIN_SEVERITY: ${{ inputs.min-severity }}
        MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
        WORKDIR: ${{ inputs.working-directory }}
        ZIZMOR_BIN: ${{ steps.download.outputs.zizmor }}
        RESOLVED_TAG: ${{ steps.resolve.outputs.tag }}
      run: |
        set -euo pipefail
        sarif="${GITHUB_WORKSPACE}/zizmor.sarif"
        tmp="$(mktemp "${RUNNER_TEMP}/zizmor-sarif.XXXXXX")"
        # Run from the workspace root and pass the audit target so the
        # SARIF artifactLocation URIs stay relative to the repository
        # root; this keeps code scanning paths and summary links correct.
        # Build the argument list so an unset min-confidence is omitted
        # (its deprecated "unknown" value has no effect upstream). The
        # array always holds elements, so it stays safe under `set -u`.
        args=(--persona "${PERSONA}" --min-severity "${MIN_SEVERITY}")
        if [ -n "${MIN_CONFIDENCE}" ]; then
          args+=(--min-confidence "${MIN_CONFIDENCE}")
        fi
        args+=(--format sarif)
        # Run zizmor without letting a non-zero exit abort the step, so a
        # "no inputs collected" result can be told apart from a real
        # failure. In SARIF mode zizmor never emits the finding exit codes
        # (11-14), so the outcomes are 0 (clean), 1 (internal error),
        # 2 (bad arguments) or 3 (no inputs). See zizmor's exit codes:
        # https://docs.zizmor.sh/usage/#exit-codes
        rc=0
        # Word-splitting of EXTRA_ARGS is intentional (passthrough).
        # shellcheck disable=SC2086
        "${ZIZMOR_BIN}" "${args[@]}" ${EXTRA_ARGS} "${WORKDIR}" \
          > "${tmp}" || rc=$?
        if [ "${rc}" -eq 3 ]; then
          # No workflows, actions, or Dependabot config to audit (e.g. a
          # docs-only or fixture repository). Treat the empty audit as a
          # clean result: write a valid SARIF with zero findings so the
          # summary, the caller's gate and any SARIF upload all see the
          # repository as clean, instead of failing the whole run over a
          # repository that has nothing to audit.
          echo "::notice::zizmor collected no auditable inputs;" \
            "reporting a clean (empty) result"
          ver="${RESOLVED_TAG#v}"
          # python3 is already required by this step, so synthesise the
          # empty SARIF with it rather than adding a jq dependency.
          # The heredoc body and its PY terminator are written at this
          # run block's base indent. YAML strips that indent before bash
          # sees the script, so the terminator ends up with no leading
          # whitespace (which <<'PY' requires) and every Python line at
          # column 0. Keep them at the base indent: if the block's
          # indentation ever changes they must move with it, or the
          # heredoc will not terminate. Each Python statement is
          # top-level or a bracket continuation, so none needs indenting.
          # -I keeps the working directory (the audited workspace) off
          # sys.path, so json is the standard library module.
          python3 -I - "${ver}" > "${tmp}" <<'PY'
        import json, sys
        v = sys.argv[1]
        schema = ("https://docs.oasis-open.org/sarif/sarif/v2.1.0/"
        "os/schemas/sarif-schema-2.1.0.json")
        json.dump({
        "$schema": schema,
        "version": "2.1.0",
        "runs": [{
        "tool": {"driver": {
        "name": "zizmor", "version": v, "semanticVersion": v,
        "informationUri": "https://docs.zizmor.sh", "rules": []
        }},
        "invocations": [{"executionSuccessful": True}],
        "results": []
        }]
        }, sys.stdout)
        PY
        elif [ "${rc}" -ne 0 ]; then
          echo "::error::zizmor exited with code ${rc}" >&2
          exit "${rc}"
        fi
        python3 -I -c 'import json,sys; json.load(open(sys.argv[1]))' "${tmp}"
        mv "${tmp}" "${sarif}"
        echo "sarif=${sarif}" >> "$GITHUB_OUTPUT"
        bytes=$(wc -c < "${sarif}" | tr -d ' ')
        echo "Wrote ${sarif} (${bytes} bytes)"

    - name: 'Summarise findings'
      if: ${{ steps.zizmor.outcome == 'success' }}
      shell: 'bash'
      env:
        ZIZMOR_SARIF: ${{ steps.zizmor.outputs.sarif }}
        ZIZMOR_PERSONA: ${{ inputs.persona }}
        ZIZMOR_MIN_SEVERITY: ${{ inputs.min-severity }}
        ZIZMOR_TOP_N: '10'
        ZIZMOR_REPOSITORY: ${{ inputs.summary-repository }}
        ZIZMOR_SHA: ${{ inputs.summary-sha }}
        ZIZMOR_ANNOTATE: ${{ inputs.annotate }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        python3 -I "${ACTION_PATH}/scripts/zizmor_summary.py"

    - name: 'Upload SARIF to code scanning'
      if: >-
        ${{ inputs.upload-sarif == 'true'
        && steps.zizmor.outcome == 'success' }}
      # yamllint disable-line rule:line-length
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
      with:
        sarif_file: ${{ steps.zizmor.outputs.sarif }}
        # Category groups these results in code scanning.
        category: 'zizmor'

    - name: 'Clean up temporary files'
      if: always()
      shell: 'bash'
      env:
        TMP_WORKDIR: ${{ steps.download.outputs.workdir }}
      run: |
        set -euo pipefail
        if [ -n "${TMP_WORKDIR:-}" ] && [ -d "${TMP_WORKDIR}" ]; then
          rm -rf "${TMP_WORKDIR}"
        fi
